name: Build Lyra Aura APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # botão "Run workflow" manual no GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Make gradlew executable (if present)
        working-directory: ./lyra-aura
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Debug APK
        working-directory: ./lyra-aura
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyra-Aura-debug
          path: lyra-aura/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show APK info
        run: |
          echo "✅ Build completo!"
          ls -lh lyra-aura/app/build/outputs/apk/debug/ 2>/dev/null || true
